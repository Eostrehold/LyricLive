<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">LyricLive - 在 Minecraft 中举办卡拉 OK 与唱歌比赛</title>
  <desc id="heroDesc">LyricLive 是一个基于 Fabric 的纯客户端 Minecraft 模组，导入 LRC 歌词文件后通过 HUD 在游戏画面中实时显示，并支持自动发送到聊天栏。</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0B0A"/>
      <stop offset="60%" stop-color="#12100E"/>
      <stop offset="100%" stop-color="#1A1612"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="0.72" cy="0.08" r="0.5">
      <stop offset="0%" stop-color="#D4A843" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#D4A843" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#D4A843" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C1624"/>
      <stop offset="100%" stop-color="#1A2840"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ABF6A"/>
      <stop offset="100%" stop-color="#D4A843"/>
    </linearGradient>
    <clipPath id="mockupClip">
      <rect x="0" y="0" width="500" height="320" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#spotlight)"/>

  <!-- ===== LEFT: TITLE BLOCK ===== -->
  <g transform="translate(56 44)">
    <!-- Category -->
    <rect x="0" y="0" width="150" height="26" rx="6" fill="#1C1816" stroke="#322C26" stroke-width="1"/>
    <text x="14" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#D4A843" letter-spacing="1.4">FABRIC · CLIENT</text>

    <!-- Name -->
    <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="60" font-weight="800" fill="#F5F2EC" letter-spacing="-0.8">LyricLive</text>

    <!-- Value proposition -->
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#F5F2EC">在 Minecraft 中举办卡拉 OK</text>
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#F5F2EC">与唱歌比赛</text>

    <!-- Tagline -->
    <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#A0988E">导入 LRC 歌词 / 实时 HUD 渲染 / 聊天栏发送</text>

    <!-- Timeline progress motif -->
    <g transform="translate(0 260)">
      <line x1="0" y1="14" x2="520" y2="14" stroke="#2A2522" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="14" x2="216" y2="14" stroke="url(#playGrad)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="216" cy="14" r="7" fill="#F5F2EC" stroke="#D4A843" stroke-width="2.5"/>
      <text x="0" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6A6258">[00:00.000]</text>
      <text x="168" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5ABF6A">[01:24.350]</text>
      <text x="410" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6A6258">[03:12.000]</text>
    </g>
  </g>

  <!-- ===== RIGHT: HUD MOCKUP ===== -->
  <g transform="translate(644 40)">
    <!-- Outer frame -->
    <rect width="500" height="320" rx="20" fill="#100E0C" stroke="#322C26" stroke-width="1.5"/>
    <g clip-path="url(#mockupClip)">
      <!-- Minecraft sky -->
      <rect width="500" height="320" fill="url(#skyGrad)"/>
      
      <!-- Terrain silhouettes -->
      <rect x="0" y="172" width="500" height="148" fill="#182234"/>
      <rect x="0" y="224" width="500" height="96" fill="#1E2E40"/>
      
      <!-- Grass blocks -->
      <rect x="32" y="138" width="36" height="36" fill="#3D7A45" rx="2" opacity="0.85"/>
      <rect x="68" y="118" width="36" height="56" fill="#4A8A52" rx="2" opacity="0.75"/>
      <rect x="104" y="150" width="36" height="24" fill="#569A5E" rx="2" opacity="0.6"/>
      <rect x="140" y="142" width="36" height="32" fill="#4A8A52" rx="2" opacity="0.55"/>
      
      <!-- Stone blocks (right side) -->
      <rect x="370" y="132" width="40" height="42" fill="#4A5260" rx="2" opacity="0.65"/>
      <rect x="410" y="110" width="36" height="64" fill="#5A6270" rx="2" opacity="0.6"/>
      <rect x="446" y="144" width="32" height="30" fill="#6A7280" rx="2" opacity="0.5"/>
      
      <!-- Stars -->
      <circle cx="60" cy="28" r="1.5" fill="#F5F2EC" opacity="0.35"/>
      <circle cx="170" cy="18" r="1" fill="#F5F2EC" opacity="0.5"/>
      <circle cx="300" cy="40" r="1.5" fill="#F5F2EC" opacity="0.25"/>
      <circle cx="440" cy="22" r="1" fill="#F5F2EC" opacity="0.4"/>
      <circle cx="100" cy="62" r="1" fill="#F5F2EC" opacity="0.2"/>
      <circle cx="360" cy="14" r="1.2" fill="#F5F2EC" opacity="0.35"/>

      <!-- Status indicator -->
      <rect x="16" y="12" width="136" height="26" rx="6" fill="#14120E" stroke="#322C26" stroke-width="0.8"/>
      <circle cx="30" cy="25" r="4.5" fill="#5ABF6A"/>
      <text x="42" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#C8C0B6" font-weight="600">PLAYING</text>
      <text x="104" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6A6258">01:24/03:12</text>

      <!-- LRC card -->
      <g transform="translate(24 54)">
        <rect width="452" height="158" rx="14" fill="#100E0C" fill-opacity="0.93" stroke="#322C26" stroke-width="0.8"/>
        
        <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6A5ACD">song.lrc</text>
        <text x="382" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6A6258">AUTO ON</text>
        
        <!-- Previous -->
        <text x="16" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#4A4238">[01:18.200]</text>
        <text x="116" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#7A7268">曾经有一份真挚的爱情</text>
        
        <!-- Current -->
        <rect x="16" y="70" width="420" height="40" rx="6" fill="#1C1816" opacity="0.6"/>
        <text x="16" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#D4A843">[01:24.350]</text>
        <text x="116" y="84" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#F5F2EC">放在我面前</text>
        
        <!-- Inline progress -->
        <rect x="16" y="118" width="420" height="3" rx="1.5" fill="#2A2522"/>
        <rect x="16" y="118" width="168" height="3" rx="1.5" fill="url(#playGrad)"/>
        
        <!-- Next -->
        <text x="16" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#4A4238">[01:36.500]</text>
        <text x="116" y="140" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#7A7268">我没有珍惜</text>
      </g>

      <!-- Chat bubble -->
      <g transform="translate(24 228)">
        <rect width="452" height="34" rx="8" fill="#14120E" stroke="#322C26" stroke-width="0.8"/>
        <text x="14" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#5ABF6A" opacity="0.8">CHAT</text>
        <text x="54" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#A0D8A0">&lt;LyricLive&gt; 放在我面前</text>
      </g>
      
      <!-- Hotkey bar -->
      <rect x="16" y="278" width="120" height="24" rx="6" fill="#14120E" stroke="#2A2522" stroke-width="0.8"/>
      <text x="18" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6A6258">L / P / K / J</text>

      <!-- Auto send indicator -->
      <rect x="400" y="278" width="84" height="24" rx="6" fill="#14120E" stroke="#2A2522" stroke-width="0.8"/>
      <circle cx="412" cy="290" r="3.5" fill="#5ABF6A"/>
      <text x="420" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#5ABF6A">AUTO</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(56 386)">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5A5248">MC 26.1.2 / Fabric Loader 0.19.3+ / Java 25 / MIT / 纯客户端</text>
  </g>
</svg>